name: Deploy Turbo to VPS

on:
  push:
    branches: [main, master]
    paths:
      - "rust/**"
      - ".github/workflows/deploy-turbo.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Target architecture (e.g., x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu)"
        required: false
        default: "x86_64-unknown-linux-musl"

env:
  CARGO_TERM_COLOR: always
  TARGET: ${{ github.event.inputs.target || 'x86_64-unknown-linux-musl' }}
  DEPLOY_PATH: /opt/jetstream-turbo
  SERVICE_NAME: jetstream-turbo
  BINARY_NAME: jetstream-turbo
  RELEASE_ID: ${{ github.sha }}

jobs:
  build:
    name: Build Release Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cross
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cross
          key: ${{ runner.os }}-cross-bin

      - name: Install cross
        run: |
          if [ ! -f ~/.cargo/bin/cross ]; then
            cargo install cross --git https://github.com/cross-rs/cross
          fi

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          # Since your Cargo.toml is in the 'rust' subfolder
          workspaces: "rust -> target"

      - name: Build release binary
        working-directory: rust
        run: cross build --release --target ${{ env.TARGET }}

      - name: Strip binary
        run: strip rust/target/${{ env.TARGET }}/release/${{ env.BINARY_NAME }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-turbo-${{ env.TARGET }}
          path: rust/target/${{ env.TARGET }}/release/${{ env.BINARY_NAME }}
          retention-days: 1

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: binary-turbo-${{ env.TARGET }}

      - name: Create directories on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_TURBO_HOST }}
          username: deploy
          key: ${{ secrets.VPS_TURBO_SSH_KEY }}
          script: |
            sudo mkdir -p ${{ env.DEPLOY_PATH }}/releases/${{ env.RELEASE_ID }}
            sudo mkdir -p ${{ env.DEPLOY_PATH }}/logs
            sudo useradd -r -s /bin/false ${{ env.SERVICE_NAME }} 2>/dev/null || true
            sudo chown ${{ env.SERVICE_NAME }}:${{ env.SERVICE_NAME }} ${{ env.DEPLOY_PATH }}
            sudo chown ${{ env.SERVICE_NAME }}:${{ env.SERVICE_NAME }} ${{ env.DEPLOY_PATH }}/logs
            sudo chown -R ${{ env.SERVICE_NAME }}:${{ env.SERVICE_NAME }} ${{ env.DEPLOY_PATH }}/releases

      - name: Prepare candidate staging directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_TURBO_HOST }}
          username: deploy
          key: ${{ secrets.VPS_TURBO_SSH_KEY }}
          script: |
            sudo rm -rf /tmp/${{ env.SERVICE_NAME }}-candidate-${{ env.RELEASE_ID }}
            mkdir -p /tmp/${{ env.SERVICE_NAME }}-candidate-${{ env.RELEASE_ID }}

      - name: Copy candidate binary to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_TURBO_HOST }}
          username: deploy
          key: ${{ secrets.VPS_TURBO_SSH_KEY }}
          source: ${{ env.BINARY_NAME }}
          target: "/tmp/${{ env.SERVICE_NAME }}-candidate-${{ env.RELEASE_ID }}/"

      - name: Install versioned candidate
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_TURBO_HOST }}
          username: deploy
          key: ${{ secrets.VPS_TURBO_SSH_KEY }}
          script: |
            sudo install -o ${{ env.SERVICE_NAME }} -g ${{ env.SERVICE_NAME }} -m 0755 \
              /tmp/${{ env.SERVICE_NAME }}-candidate-${{ env.RELEASE_ID }}/${{ env.BINARY_NAME }} \
              ${{ env.DEPLOY_PATH }}/releases/${{ env.RELEASE_ID }}/${{ env.BINARY_NAME }}

      - name: Copy systemd service file to Host
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_TURBO_HOST }}
          username: deploy
          key: ${{ secrets.VPS_TURBO_SSH_KEY }}
          strip_components: 3
          source: rust/deploy/systemd/${{ env.SERVICE_NAME }}.service
          target: "/tmp/"

      - name: Move systemd service file and reload via systemctl
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_TURBO_HOST }}
          username: deploy
          key: ${{ secrets.VPS_TURBO_SSH_KEY }}
          script: |
            sudo mv /tmp/${{ env.SERVICE_NAME }}.service /etc/systemd/system/${{ env.SERVICE_NAME }}.service
            sudo systemctl daemon-reload

      - name: Copy candidate activation script to Host
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_TURBO_HOST }}
          username: deploy
          key: ${{ secrets.VPS_TURBO_SSH_KEY }}
          strip_components: 2
          source: rust/deploy/activate-candidate.sh
          target: "/tmp/"

      - name: Check for .env file
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_TURBO_HOST }}
          username: deploy
          key: ${{ secrets.VPS_TURBO_SSH_KEY }}
          script: |
            if [ ! -f ${{ env.DEPLOY_PATH }}/.env ]; then
              echo '# Create .env file at ${{ env.DEPLOY_PATH }}/.env with your configuration'
              echo '# Required: BLUESKY_HANDLE, BLUESKY_APP_PASSWORD, STREAM_NAME'
              echo '# You will need to restart the service after updating the .env file.'
              echo '# sudo systemctl restart ${{ env.SERVICE_NAME }}'
            fi

      - name: Copy Caddy setup script to Host
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_TURBO_HOST }}
          username: deploy
          key: ${{ secrets.VPS_TURBO_SSH_KEY }}
          strip_components: 2
          source: rust/deploy/setup-caddy.sh
          target: "/tmp/"

      - name: Execute Caddy setup script
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_TURBO_HOST }}
          username: deploy
          key: ${{ secrets.VPS_TURBO_SSH_KEY }}
          script: |
            sudo bash /tmp/setup-caddy.sh

      - name: Maintain schema, activate candidate, and verify readiness
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_TURBO_HOST }}
          username: deploy
          key: ${{ secrets.VPS_TURBO_SSH_KEY }}
          script: |
            sudo env \
              DEPLOY_PATH=${{ env.DEPLOY_PATH }} \
              SERVICE_NAME=${{ env.SERVICE_NAME }} \
              BINARY_NAME=${{ env.BINARY_NAME }} \
              READINESS_URL=http://127.0.0.1:8080/ready \
              READINESS_ATTEMPTS=30 \
              READINESS_INTERVAL_SECS=2 \
              bash /tmp/activate-candidate.sh \
              ${{ env.DEPLOY_PATH }}/releases/${{ env.RELEASE_ID }}/${{ env.BINARY_NAME }}
