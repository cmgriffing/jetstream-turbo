name: Runtime Memory Gate

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      event_volume:
        description: Deterministic event volume for the production-scale run
        required: false
        default: "10000"
        type: string
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
    paths:
      - "rust/src/client/**"
      - "rust/src/hydration/**"
      - "rust/src/storage/**"
      - "rust/src/turbocharger/**"
      - "rust/src/config/**"
      - "rust/tests/runtime_memory_suite.rs"
      - "rust/scripts/runtime-memory-suite.sh"
      - "rust/deploy/systemd/jetstream-turbo.service"
      - ".github/workflows/runtime-memory.yml"

permissions:
  contents: read

concurrency:
  group: runtime-memory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  memory-gate:
    name: Production-shaped memory envelope
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MEMORY_SUITE_SCALE: ${{ github.event_name == 'pull_request' && 'smoke' || 'production' }}
      MEMORY_SUITE_EVENT_VOLUME: ${{ inputs.event_volume || '10000' }}
      MEMORY_ARTIFACT_DIR: target/runtime-memory-artifacts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Run collector and total-process memory gates
        working-directory: rust
        run: scripts/runtime-memory-suite.sh

      - name: Upload machine-readable memory artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-memory-${{ github.run_id }}
          path: rust/target/runtime-memory-artifacts/*.json
          if-no-files-found: error
          retention-days: 30
