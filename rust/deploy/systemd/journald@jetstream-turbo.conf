# Service-isolated operational allocation: 384 MiB retention + 128 MiB measured
# active-file/rotation headroom within a 512 MiB allocation. Not a hard quota.
[Journal]
Storage=persistent
SplitMode=none
SystemMaxUse=384M
RuntimeMaxUse=384M
SystemMaxFileSize=16M
RuntimeMaxFileSize=16M
MaxRetentionSec=7day
MaxFileSec=1day
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToConsole=no
ForwardToWall=no
